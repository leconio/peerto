name: 功能建议 / Feature request
description: 提议一个符合点对点边界的改动 / Propose a change that fits the peer-to-peer scope
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景 / Use case
      description: 先说明遇到的问题，不要只写实现方式。 Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: 影响范围 / Impact
      options:
        - label: 会改变前后端共享协议 / Changes the shared client-server protocol
        - label: 会改变浏览器本地存储 / Changes browser-local storage
        - label: 会引入新的服务端持久化 / Adds server-side persistence
        - label: 会改变消息或文件的数据路径 / Changes the message or file data path
