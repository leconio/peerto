name: Bug report / Bug 报告
description: Report a reproducible problem / 报告可以稳定复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not post connection codes, share links, real IP addresses, TURN passwords, Turnstile secrets, SDP, or ICE candidates.
        不要提交连接码、分享链接、真实 IP、TURN 密码、Turnstile secret、SDP 或 ICE Candidate。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题
      description: What happened, and what did you expect? 发生了什么，期望结果是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open...
        2. Connect...
        3. Observe...
        1. 打开...
        2. 连接...
        3. 看到...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version / 浏览器与版本
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system / 操作系统
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Networks / 两端网络
      description: For example, home Wi-Fi to mobile data. Do not include real addresses. 例如家庭 Wi-Fi 到移动网络，不要填写真实地址。
  - type: textarea
    id: checks
    attributes:
      label: Checks performed / 已做检查
      description: Is TURN configured, and does the issue remain on another network? 是否配置 TURN，换网络后是否仍能复现？
